<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — User Not Found</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top, rgba(108, 92, 231, 0.18), transparent 32%),
                radial-gradient(circle at bottom right, rgba(0, 206, 201, 0.12), transparent 28%),
                #0A0F1A;
            color: #fff;
            font-family: Inter, sans-serif;
            padding: 24px;
        }

        .error-card {
            width: 100%;
            max-width: 560px;
            background: rgba(17, 31, 62, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
            text-align: center;
        }

        .error-code {
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 900;
            line-height: 1;
            margin: 0 0 12px;
            letter-spacing: -0.06em;
        }

        .error-title {
            margin: 0 0 10px;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
        }

        .error-message {
            color: #B0B3C5;
            margin: 0 auto 28px;
            max-width: 420px;
            line-height: 1.6;
        }

        .error-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 999px;
            padding: 8px 14px;
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #E6E9F5;
            font-size: 0.85rem;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
            padding: 12px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .error-link:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .primary-link {
            background: linear-gradient(135deg, #2563EB, #93C5FD);
            color: #fff;
        }

        .secondary-link {
            background: rgba(255, 255, 255, 0.06);
            color: #E6E9F5;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body>
    <main class="error-card">
        <div class="error-pill">404 Error</div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title" id="errorTitle">User Not Found</h2>
        <p class="error-message" id="errorMessage">The account you tried to log in with was not found or is unavailable.
        </p>
        <div class="error-actions">
            <a class="error-link primary-link" href="login.html">Back to Login</a>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const reason = params.get('reason') || 'not-found';
        const message = params.get('message');

        const title = document.getElementById('errorTitle');
        const errorMessage = document.getElementById('errorMessage');

        if (reason === 'suspended') {
            title.textContent = 'Account Suspended';
        } else {
            title.textContent = 'User Not Found';
        }

        if (message) {
            errorMessage.textContent = decodeURIComponent(message);
        } else if (reason === 'suspended') {
            errorMessage.textContent = 'This account has been suspended. Please contact the administrator.';
        } else {
            errorMessage.textContent = 'The account you tried to log in with was not found or is unavailable.';
        }
    </script>
</body>

</html>
