<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments — LearnHub</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
</head>
<body>
<div class="bg-gradient-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div id="sidebar-placeholder"></div>
<div class="dashboard-content">
  <div class="dashboard-header animate-fade-in-up">
    <h1>My <span class="text-gradient">Assignments</span></h1>
    <p>View and submit your course assignments</p>
  </div>

  <div class="tabs mb-xl" data-tab-content="assignmentTabs">
    <button class="tab-btn active" data-tab="pendingTab">Pending</button>
    <button class="tab-btn" data-tab="submittedTab">Submitted</button>
    <button class="tab-btn" data-tab="gradedTab">Graded</button>
  </div>

  <div id="assignmentTabs">
    <div class="tab-content active" id="pendingTab">
      <div id="pendingList">
        <p style="text-align:center;color:var(--text-muted);padding:var(--space-xl)">Loading assignments...</p>
      </div>
    </div>
    <div class="tab-content" id="submittedTab">
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th>Assignment</th><th>Course</th><th>Submitted</th><th>Status</th></tr></thead>
          <tbody id="submittedList"></tbody>
        </table>
      </div>
    </div>
    <div class="tab-content" id="gradedTab">
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th>Assignment</th><th>Course</th><th>Grade</th><th>Feedback</th></tr></thead>
          <tbody id="gradedList"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="../assets/js/auth-guard.js" data-role="student"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  loadComponent('sidebar-placeholder', '../components/sidebar-student.html');
  loadAssignments();
});

async function loadAssignments() {
  try {
    const submissions = await apiRequest('/assignments/my');
    
    const pendingList = document.getElementById('pendingList');
    pendingList.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:var(--space-xl)">No pending assignments found.</p>';

    const submittedList = document.getElementById('submittedList');
    const gradedList = document.getElementById('gradedList');

    if (!submissions || submissions.length === 0) {
      submittedList.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:var(--space-xl)">No submitted assignments.</td></tr>';
      gradedList.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:var(--space-xl)">No graded assignments.</td></tr>';
      return;
    }

    let submittedHtml = '';
    let gradedHtml = '';

    submissions.forEach(sub => {
      const assignmentTitle = sub.assignments?.title || 'Assignment';
      const courseTitle = sub.assignments?.courses?.title || 'Course';
      const submittedDate = new Date(sub.created_at).toLocaleDateString();
      const status = sub.status || 'pending';
      const grade = sub.grade || 0;
      const feedback = sub.feedback || 'No feedback yet';

      if (status === 'graded') {
        gradedHtml += `<tr>
          <td>${assignmentTitle}</td>
          <td>${courseTitle}</td>
          <td><span class="badge badge-success">${grade}/100</span></td>
          <td style="color:var(--text-secondary)">${feedback}</td>
        </tr>`;
      } else {
        submittedHtml += `<tr>
          <td>${assignmentTitle}</td>
          <td>${courseTitle}</td>
          <td>${submittedDate}</td>
          <td><span class="badge badge-accent">Under Review</span></td>
        </tr>`;
      }
    });

    submittedList.innerHTML = submittedHtml || '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:var(--space-xl)">No submitted assignments.</td></tr>';
    gradedList.innerHTML = gradedHtml || '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:var(--space-xl)">No graded assignments.</td></tr>';

  } catch (error) {
    console.error('Error loading assignments:', error);
    document.getElementById('pendingList').innerHTML = '<p style="text-align:center;color:var(--danger);padding:var(--space-xl)">Error loading assignments.</p>';
  }
}
</script>
</body>
</html>
