<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Courses — LearnHub</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
</head>

<body>
  <div class="bg-gradient-orbs">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>
  <div id="sidebar-placeholder"></div>

  <div class="dashboard-content">
    <div class="dashboard-header animate-fade-in-up"
      style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:var(--space-md)">
      <div>
        <h1>Manage <span class="text-gradient">Courses</span></h1>
        <p>Edit and manage your published courses</p>
      </div>
      <a href="create-course.html" class="btn btn-primary ripple-effect">+ New Course</a>
    </div>

    <div class="dashboard-card">
      <div class="dashboard-card-body">
        <div id="coursesTableWrapper" class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Course</th>
                <th>Category</th>
                <th>Level</th>
                <th>Price</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="coursesTableBody">
              <tr>
                <td colspan="5" style="text-align:center;color:var(--text-muted);padding:var(--space-2xl)">Loading
                  courses...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <h3>Edit Course</h3>
        <button class="modal-close" onclick="closeModal('editModal')">✕</button>
      </div>
      <form id="editCourseForm" onsubmit="handleEditCourse(event)">
        <input type="hidden" id="editCourseId">
        <div class="form-group">
          <label class="form-label">Course Title *</label>
          <input id="editTitle" class="form-control" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Category *</label>
            <select id="editCategory" class="form-select" required>
              <option value="">Select category</option>
              <option>Web Development</option>
              <option>Data Science</option>
              <option>Design</option>
              <option>Cloud Computing</option>
              <option>Mobile Development</option>
              <option>Cybersecurity</option>
              <option>Marketing</option>
              <option>Business</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Level *</label>
            <select id="editLevel" class="form-select" required>
              <option value="">Select level</option>
              <option>Beginner</option>
              <option>Intermediate</option>
              <option>Advanced</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="editDescription" class="form-control" rows="4"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Duration</label>
          <input id="editDuration" class="form-control" placeholder="e.g., 12 hours">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Price (₹)</label>
            <input id="editPrice" class="form-control" type="number" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label class="form-label">Original Price (₹)</label>
            <input id="editOriginalPrice" class="form-control" type="number" min="0" step="0.01">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Thumbnail URL</label>
          <input id="editThumbnail" class="form-control" placeholder="https://...">
        </div>

        <hr style="border:0;border-top:1px solid var(--border-color);margin:var(--space-lg) 0">

        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-md)">
            <label class="form-label" style="margin:0">Manage Lessons</label>
            <a href="upload-lessons.html" class="btn btn-secondary btn-sm">+ Add New</a>
          </div>
          <div id="courseLessonsList"
            style="display:flex;flex-direction:column;gap:var(--space-sm);max-height:200px;overflow-y:auto;padding-right:var(--space-xs)">
            <p style="color:var(--text-muted);font-size:var(--font-sm);text-align:center">Loading lessons...</p>
          </div>
        </div>
        <div style="display:flex;gap:var(--space-md);justify-content:flex-end;margin-top:var(--space-lg)">
          <button type="button" class="btn btn-secondary" onclick="closeModal('editModal')">Cancel</button>
          <button type="submit" id="editSubmitBtn" class="btn btn-primary ripple-effect">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" style="max-width:420px;text-align:center">
      <div style="font-size:3rem;margin-bottom:var(--space-md)">🗑️</div>
      <h3 style="margin-bottom:var(--space-sm)">Delete Course?</h3>
      <p style="color:var(--text-secondary);font-size:var(--font-sm);margin-bottom:var(--space-xl)">
        This action cannot be undone. All course data will be permanently removed.
      </p>
      <input type="hidden" id="deleteCourseId">
      <div style="display:flex;gap:var(--space-md);justify-content:center">
        <button class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancel</button>
        <button class="btn btn-danger ripple-effect" id="confirmDeleteBtn"
          onclick="handleDeleteCourse()">Delete</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/auth-guard.js" data-role="instructor"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script>
    const categoryIcons = {
      'Web Development': '💻', 'Data Science': '📊', 'Design': '🎨',
      'Cloud Computing': '☁️', 'Mobile Development': '📱', 'Cybersecurity': '🔒',
      'Marketing': '📈', 'Business': '💼', 'default': '📚'
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadComponent('sidebar-placeholder', '../components/sidebar-instructor.html');
      loadCourses();
    });

    async function loadCourses() {
      const tbody = document.getElementById('coursesTableBody');
      try {
        const user = JSON.parse(localStorage.getItem('lms_user') || '{}');
        const myCourses = await apiRequest(`/courses?instructor_id=${user.id}`);

        if (!myCourses.length) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:var(--space-2xl)">
            No courses yet. <a href="create-course.html" style="color:var(--primary-light)">Create your first course →</a>
          </td></tr>`;
          return;
        }

        tbody.innerHTML = myCourses.map(course => {
          const icon = categoryIcons[course.category] || categoryIcons.default;
          return `
            <tr>
              <td>
                <div style="display:flex;align-items:center;gap:var(--space-md)">
                  <span style="font-size:1.5rem">${icon}</span>
                  <div>
                    <p style="font-weight:600">${course.title}</p>
                    <p style="font-size:var(--font-xs);color:var(--text-muted)">${course.duration || '—'}</p>
                  </div>
                </div>
              </td>
              <td><span class="badge badge-primary">${course.category}</span></td>
              <td><span class="badge badge-accent">${course.level}</span></td>
              <td style="font-weight:600">₹${course.price ?? '—'}</td>
              <td>
                <div style="display:flex;gap:var(--space-sm)">
                  <button class="btn btn-secondary btn-sm" onclick="openEditModal(${JSON.stringify(course).replace(/"/g, '&quot;')})">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="openDeleteModal('${course.id}')">Delete</button>
                </div>
              </td>
            </tr>`;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--danger);padding:var(--space-2xl)">${err.message || 'Failed to load courses'}</td></tr>`;
      }
    }

    function openEditModal(course) {
      document.getElementById('editCourseId').value = course.id;
      document.getElementById('editTitle').value = course.title || '';
      document.getElementById('editCategory').value = course.category || '';
      document.getElementById('editLevel').value = course.level || '';
      document.getElementById('editDescription').value = course.description || '';
      document.getElementById('editDuration').value = course.duration || '';
      document.getElementById('editPrice').value = course.price ?? '';
      document.getElementById('editOriginalPrice').value = course.original_price ?? '';
      document.getElementById('editThumbnail').value = course.thumbnail_url || '';
      openModal('editModal');
      loadCourseLessonsForEdit(course.id);
    }

    async function loadCourseLessonsForEdit(courseId) {
      const list = document.getElementById('courseLessonsList');
      list.innerHTML = '<p style="color:var(--text-muted);font-size:var(--font-sm);text-align:center">Loading lessons...</p>';
      try {
        const lessons = await apiRequest(`/lessons?course_id=${courseId}`);
        if (!lessons || !lessons.length) {
          list.innerHTML = '<p style="color:var(--text-muted);font-size:var(--font-sm);text-align:center">No lessons added yet.</p>';
          return;
        }

        list.innerHTML = lessons.map(lesson => {
          let icon = '📋';
          if (lesson.type === 'video') icon = '▶';
          if (lesson.type === 'quiz') icon = '❓';

          return `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:var(--space-sm);background:var(--bg-glass);border:1px solid var(--border-color);border-radius:var(--radius-md)">
              <div style="display:flex;align-items:center;gap:var(--space-sm);overflow:hidden">
                <span style="color:var(--text-muted)">${icon}</span>
                <span style="font-weight:500;font-size:var(--font-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lesson.title}</span>
              </div>
              <button type="button" class="btn btn-danger btn-sm" onclick="handleDeleteLesson('${lesson.id}', '${courseId}')" title="Delete Lesson">🗑️</button>
            </div>
          `;
        }).join('');
      } catch (err) {
        list.innerHTML = '<p style="color:var(--danger);font-size:var(--font-sm);text-align:center">Failed to load lessons.</p>';
      }
    }

    async function handleDeleteLesson(lessonId, courseId) {
      if (!confirm('Are you sure you want to delete this lesson?')) return;
      try {
        await apiRequest(`/lessons/${lessonId}`, 'DELETE');
        showToast('Lesson deleted successfully', 'success');
        loadCourseLessonsForEdit(courseId); // Reload the list
      } catch (err) {
        showToast(err.message || 'Failed to delete lesson', 'error');
      }
    }

    async function handleEditCourse(e) {
      e.preventDefault();
      const btn = document.getElementById('editSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const id = document.getElementById('editCourseId').value;
      const payload = {
        title: document.getElementById('editTitle').value.trim(),
        category: document.getElementById('editCategory').value,
        level: document.getElementById('editLevel').value,
        description: document.getElementById('editDescription').value.trim(),
        duration: document.getElementById('editDuration').value.trim(),
        price: parseFloat(document.getElementById('editPrice').value) || 0,
        original_price: parseFloat(document.getElementById('editOriginalPrice').value) || 0,
        thumbnail_url: document.getElementById('editThumbnail').value.trim() || null,
      };

      try {
        await apiRequest(`/courses/${id}`, 'PUT', payload);
        showToast('Course updated successfully!', 'success');
        closeModal('editModal');
        loadCourses();
      } catch (err) {
        showToast(err.message || 'Failed to update course', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      }
    }

    function openDeleteModal(courseId) {
      document.getElementById('deleteCourseId').value = courseId;
      openModal('deleteModal');
    }

    async function handleDeleteCourse() {
      const btn = document.getElementById('confirmDeleteBtn');
      btn.disabled = true;
      btn.textContent = 'Deleting...';

      const id = document.getElementById('deleteCourseId').value;
      try {
        await apiRequest(`/courses/${id}`, 'DELETE');
        showToast('Course deleted', 'success');
        closeModal('deleteModal');
        loadCourses();
      } catch (err) {
        showToast(err.message || 'Failed to delete course', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Delete';
      }
    }
  </script>
</body>

</html>
