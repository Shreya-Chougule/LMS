<!-- Search card fixed top right -->

  <div class="navbar-search">
    <div class="search-card" id="searchCard">
      <div class="search-card-line" id="searchLine"></div>
      <input type="text" placeholder="Search courses..." id="navSearchInput" autocomplete="off">
      <span class="search-card-label" id="searchLabel">Search</span>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

<!-- Floating pill navbar -->
<nav class="navbar" id="mainNavbar">
  <div class="navbar-inner">
    <div class="navbar-links" id="navLinks">
      <a href="./">Home</a>
      <a href="./course-catalog.html" id="navCoursesLink">Courses</a>
      <a href="./student/dashboard.html" id="navDashboardLink">Dashboard</a>
    </div>
    <div class="navbar-actions">
      <button class="navbar-toggle" id="navToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>
<script>
// Adjust navbar links based on user role
(function() {
  try {
    const user = JSON.parse(localStorage.getItem('lms_user') || '{}');
    const role = user.role;
    const coursesLink = document.getElementById('navCoursesLink');
    const dashLink = document.getElementById('navDashboardLink');

    if (role === 'instructor') {
      // Instructors don't need course catalog; link to their dashboard
      if (coursesLink) coursesLink.style.display = 'none';
      if (dashLink) { dashLink.href = './instructor/dashboard.html'; dashLink.textContent = 'Dashboard'; }
    } else if (role === 'admin') {
      if (coursesLink) coursesLink.style.display = 'none';
      if (dashLink) { dashLink.href = './admin/dashboard.html'; dashLink.textContent = 'Dashboard'; }
    } else if (role === 'guest') {
      if (dashLink) { dashLink.href = './login.html'; dashLink.textContent = 'Sign In'; }
    } else {
      // Students see courses + their dashboard
      if (dashLink) { dashLink.href = './student/dashboard.html'; dashLink.textContent = 'Dashboard'; }
    }
  } catch (e) {}
})();
</script>
