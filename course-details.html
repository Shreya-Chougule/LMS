<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View course details, modules, and enroll on LearnHub.">
  <title>Course Details — LearnHub</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/course.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <style>
    .what-you-learn{background:var(--bg-glass);border:1px solid var(--bg-glass-border);border-radius:var(--radius-lg);padding:var(--space-xl);margin-bottom:var(--space-xl)}
    .what-you-learn h3{margin-bottom:var(--space-lg)}
    .learn-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm)}
    .course-content-section{margin-bottom:var(--space-xl)}
    .course-content-section h3{margin-bottom:var(--space-lg)}
    .instructor-card{display:flex;gap:var(--space-xl);background:var(--bg-glass);border:1px solid var(--bg-glass-border);border-radius:var(--radius-lg);padding:var(--space-xl)}
    .instructor-avatar{width:100px;height:100px;border-radius:50%;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:white;flex-shrink:0}
    .instructor-info h3{margin-bottom:var(--space-xs)}
    .instructor-info .specialization{color:var(--primary-light);font-size:var(--font-sm);margin-bottom:var(--space-md)}
    .instructor-info p{color:var(--text-secondary);font-size:var(--font-sm);line-height:1.7;margin-bottom:var(--space-md)}
    .instructor-stats{display:flex;gap:var(--space-xl)}
    .instructor-stats .stat{font-size:var(--font-sm);color:var(--text-muted)}
    .instructor-stats .stat strong{color:var(--text-primary);display:block;font-size:var(--font-lg)}
    @media(max-width:768px){.learn-grid{grid-template-columns:1fr}.instructor-card{flex-direction:column;align-items:center;text-align:center}.instructor-stats{justify-content:center}}
  </style>
</head>
<body>
<div class="bg-particles"></div>
<div class="bg-gradient-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div id="navbar-placeholder"></div>

<section class="course-hero">
  <div class="container course-hero-content">
    <div class="course-hero-info" id="courseHeroInfo">
      <p style="color:var(--text-muted)">Loading course...</p>
    </div>
    <div class="enrollment-card" id="enrollmentCard"></div>
  </div>
</section>

<main style="padding:var(--space-2xl) 0">
  <div class="container">
    <!-- What you'll learn -->
    <div class="what-you-learn" data-animate="fade-in-up">
      <h3>What You'll Learn</h3>
      <div class="learn-grid" id="whatYouLearn"></div>
    </div>

    <!-- Course content -->
    <div class="course-content-section" data-animate="fade-in-up">
      <h3>Course Content</h3>
      <div id="courseModules"></div>
    </div>

    <!-- Instructor -->
    <div class="course-content-section" data-animate="fade-in-up">
      <h3>Instructor</h3>
      <div class="instructor-card" id="instructorCard">
        <div class="instructor-avatar">👩‍🏫</div>
        <div class="instructor-info">
          <h3 id="instrName">Loading...</h3>
          <p class="specialization" id="instrSpec"></p>
          <p id="instrBio"></p>
          <div class="instructor-stats" id="instrStats"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="assets/js/main.js"></script>
<script src="assets/js/navbar.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/course.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  loadComponent('navbar-placeholder', 'components/navbar.html');
  loadComponent('footer-placeholder', 'components/footer.html');
  renderCourseDetails();
});
</script>
</body>
</html>
